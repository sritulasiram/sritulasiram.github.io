<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Tulasi Ram | System Initializing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Dark Slate */
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            padding: 2.5rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #1e293b;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 85%;
        }
        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 0.2rem;
            color: #38bdf8; /* Tech Blue */
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 1rem;
            margin-bottom: 2rem;
            color: #94a3b8;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .terminal {
            text-align: left;
            background: #000;
            padding: 1.2rem;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #10b981; /* Terminal Green */
            line-height: 1.6;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background-color: #10b981;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sri Tulasi Ram</h1>
        <div class="subtitle">Graduate Engineer | Support Engineer, Genie Team</div>
        
        <div class="terminal">
            > Initializing boot sequence...<br>
            > Loading IoT architecture... [OK]<br>
            > Establishing network diagnostics... [OK]<br>
            > Compiling portfolio modules...<br>
            > Status: A surprise is launching soon.<span class="cursor"></span>
        </div>
    </div>
</body>
</html>
